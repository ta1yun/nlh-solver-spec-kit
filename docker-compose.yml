version: '3.8'

services:
  # NLH Solver API Server
  api:
    build: .
    container_name: nlh-solver-api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - JAVA_OPTS=-Xmx8g -Xms2g -XX:+UseG1GC
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
    command: ["api"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # CLI helper service (one-off commands)
  cli:
    build: .
    container_name: nlh-solver-cli
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - JAVA_OPTS=-Xmx8g -Xms2g -XX:+UseG1GC
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
    entrypoint: ["/app/bin/nlhsolver"]
    profiles:
      - cli
